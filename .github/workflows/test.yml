name: Tests

# On every push and pull request, and weekly against the newest LobsterBoard release,
# so a new LobsterBoard widget without a tower room shows up as a failing check.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Use the newest LobsterBoard release
        run: npm i --no-save lobsterboard@latest
      - run: npm test
